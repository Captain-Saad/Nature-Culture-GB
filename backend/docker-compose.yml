services:
  postgres:
    image: postgres:16-alpine
    container_name: ncgb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ncgb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncgb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ncgb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ncgb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncgb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ncgb_postgres_data:
