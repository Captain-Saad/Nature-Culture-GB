services:
  - type: web
    name: ncgb-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # --include=dev overrides NODE_ENV=production (set below) for this
    # install -- without it, npm skips devDependencies at build time,
    # which is exactly where typescript and every @types/* package live
    # that `tsc` needs to compile. The compiled output has no trace of
    # them; this only affects what's present during the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # All of the below have no default and must be filled in from the
      # Render dashboard after the first deploy (Environment tab) --
      # `sync: false` means "prompt for this, don't source it from a
      # linked env var group or commit a value here."
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      # Supabase Storage for admin uploads -- without these, uploads land
      # on Render's ephemeral disk and vanish on the next restart.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Gmail notifications (new requests, closed bookings, contact messages)
      # and the Google Sheet mirror of leads -- see .env.example.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL_TO
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_WEBHOOK_SECRET
        sync: false
